<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호박 고누</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{
  --ink:#fdf3dc; --dim:#c9b38f; --dark:#1b120d; --panel:#2a1b14; --edge:#0e0907;
  --orange:#ff9a2e; --orange-d:#c25a12; --cyan:#59e0ff; --cyan-d:#1d7fa8; --gold:#ffd84a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:#1a110d;
  color:var(--ink); font-family:'Galmuri11','Galmuri9',system-ui,sans-serif;
  overflow:hidden; user-select:none;
}
img{image-rendering:pixelated}
/* 배경 그림은 게임 화면 기둥 안에만, 원래 크기보다 작게 보이도록 */
.app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:#2b1d18 url(img/bg.webp) center top/cover no-repeat;box-shadow:0 0 0 4px #0e0907,0 0 60px rgba(0,0,0,.6)}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
.box{background:rgba(27,18,13,.88);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #5a3a26, 4px 4px 0 rgba(0,0,0,.45);padding:14px}
.btn{font:inherit;font-size:18px;color:var(--dark);background:var(--orange);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 var(--orange-d),inset 3px 3px 0 #ffd09a,3px 3px 0 rgba(0,0,0,.5);padding:12px 18px;cursor:pointer;width:100%}
.btn:active{transform:translate(2px,2px);box-shadow:inset -3px -3px 0 var(--orange-d),inset 3px 3px 0 #ffd09a}
.btn.sub{background:#6b4a33;color:var(--ink);box-shadow:inset -3px -3px 0 #3e2a1c,inset 3px 3px 0 #8f6a4c,3px 3px 0 rgba(0,0,0,.5)}
.btn.small{font-size:14px;padding:8px 12px;width:auto}
.btn:disabled{opacity:.5}

/* 첫 화면 */
#home{justify-content:center;gap:14px;align-items:stretch;overflow-y:auto}
.home-main{display:flex;flex-direction:column;gap:14px}
.title{text-align:center;margin-top:8px}
.title h1{font-size:44px;margin:0;color:var(--orange);text-shadow:3px 3px 0 var(--edge),-2px -2px 0 var(--edge),2px -2px 0 var(--edge),-2px 2px 0 var(--edge)}
.title p{margin:6px 0 0;color:var(--dim);font-size:13px}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:10px;height:110px}
.duo img{width:96px;animation:bob 1.4s ease-in-out infinite}
.duo img:last-child{animation-delay:.6s}
.duo b{font-size:22px;color:var(--gold);margin-bottom:34px}
@keyframes bob{50%{transform:translateY(-6px)}}
.acct{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}
.tier{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin-right:4px;image-rendering:auto}
.acct .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who b{color:var(--gold);font-weight:normal}
/* 오늘의 순위 */
.rank h3{margin:0 0 8px;font-size:17px;color:var(--orange);display:flex;justify-content:space-between;align-items:baseline;font-weight:normal}
.rank h3 small{font-size:11px;color:var(--dim)}
.champ{display:flex;align-items:center;gap:8px;background:rgba(255,216,74,.12);border:2px solid #8a6d1c;padding:6px 8px;margin-bottom:8px;font-size:13px}
.champ img{width:34px;height:34px;object-fit:contain}
.champ b{color:var(--gold);font-weight:normal}
.rank ol{list-style:none;margin:0;padding:0;font-size:14px}
.rank li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed #4a3222}
.rank li:last-child{border-bottom:0}
.rank li .n{width:26px;text-align:right;color:var(--dim)}
.rank li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li .wdl{font-size:11px;color:var(--dim)}
.rank li .pt{min-width:40px;text-align:right;color:var(--gold)}
.rank li.top1 .n{color:var(--gold)}
.rank li.me{background:rgba(255,154,46,.18)}
.rank .empty{color:var(--dim);font-size:13px;line-height:1.6;padding:6px 0}
.rank .gap{justify-content:center;color:var(--dim);border-bottom:0;padding:0}
.err{color:#ff8a7a;font-size:13px;min-height:18px;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:10px}

/* 기다리는 화면 */
#wait{justify-content:center;align-items:center;gap:20px;text-align:center}
#wait .box{width:100%}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.wait-pcs{display:flex;justify-content:center;gap:28px;margin:14px 0}
.wait-pcs img{width:64px;animation:hop .7s ease-in-out infinite}
.wait-pcs img:last-child{animation-delay:.35s}
@keyframes hop{50%{transform:translateY(-10px)}}

/* 대전 화면 */
#game{gap:8px}
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px}
.bar img{width:40px;height:40px;object-fit:contain}
.bar .who{flex:1;min-width:0}
.bar .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .name .crown{width:20px;height:16px;object-fit:contain;margin-left:4px;vertical-align:-2px}
.bar .info{font-size:12px;color:var(--dim);margin-top:2px}
.bar .clock{font-size:22px;min-width:36px;text-align:right;color:var(--dim)}
.bar.turn{box-shadow:inset 0 0 0 2px var(--gold),4px 4px 0 rgba(0,0,0,.45)}
.bar.turn .clock{color:var(--gold)}
.bar.turn .clock.low{color:#ff6b5a;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.tbar{height:6px;background:#120b08;margin-top:5px;border:1px solid var(--edge)}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(0);will-change:transform}
.board-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
svg#board{width:100%;height:100%;max-height:100%;overflow:visible}
.hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none}
.hint span{display:inline-block;background:rgba(14,9,7,.9);border:3px solid var(--gold);color:var(--gold);padding:10px 16px;font-size:20px;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
.pc{transition:transform .34s cubic-bezier(.25,.8,.35,1);cursor:pointer}
.pc .hopper.go{animation:jump .34s ease-out}
@keyframes jump{0%{transform:translateY(0)}45%{transform:translateY(-16px)}75%{transform:translateY(0) scale(1.08,.92)}100%{transform:translateY(0)}}
.pc .ring{display:none}
.pc.can .ring{display:block;animation:blink .8s steps(2) infinite}
.pc.sel .ring{display:block;animation:none;stroke:var(--gold)}
.spark{animation:twinkle 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spark:nth-of-type(2){animation-delay:.55s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.dest{animation:blink .6s steps(2) infinite;pointer-events:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot .moves{font-size:12px;color:var(--ink);background:rgba(14,9,7,.85);border:2px solid var(--edge);padding:5px 8px}

/* 놀이 방법 */
.helpbody{display:flex;flex-direction:column;gap:12px}
.helpbody .hl,.helpbody .cap{margin:0;font-size:15px;line-height:1.65;text-align:center;text-wrap:balance}
.helpbody .cap{font-size:14px;color:var(--dim)}
.helpbody b{font-weight:normal;color:var(--gold)}
.helpbody b.no{color:#ff8a7a}
.hfig{background:rgba(10,6,4,.6);border:2px solid var(--edge);padding:8px;display:flex;justify-content:center}
.hfig svg{width:auto;max-width:100%;height:250px;display:block}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.5;background:rgba(10,6,4,.6);padding:8px 10px;border:2px solid var(--edge)}
.tips .tk{flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--gold);color:var(--dark);font-size:14px}
.tips .tk img{width:34px;height:34px;object-fit:contain}
.tips .tk.pic{background:#3a2618}
.hdots{display:flex;justify-content:center;gap:8px;margin:14px 0 12px}
.hdots i{width:10px;height:10px;background:#4a3222}
.hdots i.on{background:var(--gold)}
.help-acts{display:flex;gap:10px}
.help-acts .btn{flex:1}
/* 꾸미기 */
.deco-tier{display:flex;align-items:center;gap:12px;background:rgba(10,6,4,.6);border:2px solid var(--edge);padding:10px 12px;margin-bottom:12px}
.deco-tier img{width:52px;height:52px;object-fit:contain}
.deco-tier .tn{font-size:20px;color:var(--gold)}
.deco-tier .ts{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
.deco-tier .pb{height:8px;background:#120b08;border:1px solid var(--edge);margin-top:6px}
.deco-tier .pb i{display:block;height:100%;background:#7dff8a}
.deco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.deco-item{font:inherit;color:var(--ink);background:rgba(10,6,4,.6);border:3px solid var(--edge);padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.deco-item.on{border-color:var(--gold);background:rgba(255,216,74,.14)}
.deco-item.lock{opacity:.45;cursor:default}
.deco-item .pv{position:relative;width:72px;height:72px}
.deco-item .pv img{position:absolute;image-rendering:pixelated}
.deco-item .nm{font-size:13px}
.deco-item .rq{font-size:11px;color:var(--dim)}
.deco-item.on .rq{color:var(--gold)}
.deco-note{font-size:12px;color:var(--dim);line-height:1.6;text-align:center;margin:12px 0}
.deco-note b{color:var(--gold);font-weight:normal}
.result .score .up{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--gold);margin-top:6px}
.result .score .up img{width:28px;height:28px;object-fit:contain;margin:0;display:inline}
.result .score .meh{color:var(--dim);font-size:12px;margin-top:4px}
/* 컴퓨터와 연습 */
.ai-opt{font:inherit;color:var(--ink);text-align:left;display:flex;align-items:center;gap:12px;background:rgba(10,6,4,.6);border:3px solid var(--edge);padding:8px 10px;cursor:pointer}
.ai-opt:hover,.ai-opt:focus{border-color:var(--gold)}
.ai-opt .pv{position:relative;width:52px;height:52px;flex:none}
.ai-opt .pv img{position:absolute;left:4px;top:8px;width:44px;height:44px;object-fit:contain;image-rendering:pixelated}
.ai-opt .pv img.hat{left:11px;top:-4px;width:30px;height:26px}
.ai-opt b{color:var(--gold);font-weight:normal;font-size:16px}
.ai-opt small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
/* 소리 켜고 끄기 */
.app{position:relative}
.snd{display:flex;gap:6px}
.home-snd{position:absolute;top:10px;left:12px;z-index:5}
.app:not(:has(#home.on)) .home-snd{display:none}
.sndb{width:34px;height:34px;padding:6px;background:rgba(14,9,7,.85);border:2px solid var(--edge);color:var(--gold);cursor:pointer}
.sndb svg{width:100%;height:100%;display:block}
.sndb .x{display:none}
.sndb.off{color:#8a7a62}
.sndb.off .x{display:block}
.sndb.off .w{display:none}
.foot .snd{margin-left:auto;gap:5px}
.foot .moves{white-space:nowrap}
#leaveBtn{white-space:nowrap;padding:8px 10px}
@media (max-width:380px){.sndb{width:30px;height:30px;padding:5px}}
/* 지금 대전 중 */
#waitInfo{word-break:keep-all;text-wrap:balance;line-height:1.6}
.live{align-self:center;font-size:13px;color:var(--ink);background:rgba(14,9,7,.85);border:2px solid var(--edge);padding:5px 12px;margin-top:-6px}
.live b{color:var(--gold);font-weight:normal}
.live i{display:inline-block;width:8px;height:8px;background:#7dff8a;margin-right:6px;vertical-align:1px;animation:blink 1.2s steps(2) infinite}
.live i.off{background:#8a7a62;animation:none}
/* 감정 표현 */
#game{position:relative}
.bub{position:absolute;left:12px;z-index:6;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);background:#fdf3dc;color:#2a1b14;border:3px solid var(--edge);box-shadow:3px 3px 0 rgba(0,0,0,.45);padding:6px 12px 6px 8px;font-size:14px;line-height:1.4;opacity:0;transform:scale(.6);transform-origin:20px 0;transition:opacity .18s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.bub.on{opacity:1;transform:none}
.bub img{width:44px;height:44px;object-fit:contain;image-rendering:pixelated;flex:none}
.bub::before{content:'';position:absolute;left:22px;top:-11px;border:8px solid transparent;border-bottom-color:var(--edge);border-top:0}
.bub.me{transform-origin:20px 100%}
.bub.me::before{top:auto;bottom:-11px;border-bottom:0;border-top:8px solid var(--edge)}
.bub b{font-weight:normal;color:#8a4a12;font-size:12px;display:block}
.emo-pan{position:absolute;right:0;bottom:56px;z-index:7;background:rgba(27,18,13,.97);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #5a3a26,4px 4px 0 rgba(0,0,0,.5);padding:10px;width:min(100%,330px)}
.emo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.emo-grid button{font:inherit;color:var(--ink);background:#2a1b14;border:2px solid var(--edge);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}
.emo-grid button img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
.emo-grid button:disabled{opacity:.4}
.emo-hide{display:block;font-size:12px;color:var(--dim);margin-top:8px}
/* 창 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.modal .box{max-width:440px;width:100%;max-height:90dvh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:22px;color:var(--orange)}
.modal ol{padding-left:20px;margin:0 0 14px;line-height:1.7;font-size:15px}
.result{text-align:center}
.result img{width:120px;height:120px;object-fit:contain;margin:6px auto 4px;display:block}
.result h2{font-size:30px;margin:4px 0}
.result p{color:var(--dim);margin:0 0 16px;font-size:14px}
.result p.score{color:var(--ink);background:rgba(255,216,74,.1);border:2px solid #5a4a1c;padding:8px;margin-top:-6px;min-height:20px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel);border:3px solid var(--edge);padding:10px 14px;font-size:14px;z-index:20;display:none;max-width:90vw;text-align:center}
.toast.on{display:block}
.netbar{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#7a2b2b;color:#fff;border:3px solid var(--edge);padding:8px 14px;font-size:14px;z-index:21;display:none;white-space:nowrap}
.netbar.on{display:block}
.testtag{position:fixed;right:6px;top:6px;font-size:11px;background:#7a1f1f;padding:2px 6px;z-index:30}
/* 가로 화면(크롬북·컴퓨터): 가로 배경을 화면 전체에, 첫 화면은 두 칸 */
@media (min-aspect-ratio: 5/4) and (min-width: 760px){
  body{background:#2b1d18 url(img/bg_wide.webp) center/cover no-repeat}
  .app{max-width:980px;background:none;box-shadow:none;padding-top:max(12px, 9vh)}
  #wait,#game{width:100%;max-width:480px;margin:0 auto}
  #home{flex-direction:row;align-items:center;gap:28px;overflow:visible}
  #home .home-main{flex:1;max-width:440px}
  #home .rank{flex:1;max-width:400px;max-height:100%;overflow:auto}
}
</style>
</head>
<body>
<div class="app">

  <div class="snd home-snd"><button class="sndb sfxT" aria-label="효과음"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="w" d="M11 5.5q2 2.5 0 5M12.8 3.8q3.4 4.2 0 8.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path class="x" d="M10.5 5.5l5 5M15.5 5.5l-5 5" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="sndb bgmT" aria-label="배경음악"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5l8-1.5v9.5a2.2 2 0 1 1-1.6-1.9V4.2L7.6 5.1v7.4a2.2 2 0 1 1-1.6-1.9z" fill="currentColor"/><path class="x" d="M1.5 14.5l13-13" stroke="#ff6b5a" stroke-width="2"/></svg></button></div>
  <section id="home" class="screen on">
    <div class="home-main">
      <div class="title"><h1>호박 고누</h1><p>상대 말을 꼼짝 못 하게 가두면 이겨요</p></div>
      <div class="duo"><img id="duoA" src="img/pumpkin_idle.png" alt=""><b>VS</b><img id="duoB" src="img/wisp_idle.png" alt=""></div>
      <div class="live" id="liveCount" hidden></div>
      <div class="box">
        <div class="acct"><img class="tier" id="acctTier" alt="" hidden><span class="who" id="acctWho">생각 오락실 계정으로 해요</span><button class="btn sub small" id="acctBtn">로그인</button></div>
        <div class="stack">
          <button class="btn" id="startBtn">대전 시작</button>
          <button class="btn sub" id="aiBtn">컴퓨터와 연습</button>
          <div class="help-acts"><button class="btn sub" id="decoBtn">꾸미기</button><button class="btn sub" id="howBtn">놀이 방법</button></div>
        </div>
        <div class="err" id="homeErr"></div>
      </div>
    </div>
    <div class="box rank" id="rankBox">
      <h3>오늘의 순위 <small id="rankDay"></small></h3>
      <div id="champLine"></div>
      <div id="rankList"><div class="empty">순위를 불러오는 중…</div></div>
    </div>
  </section>

  <section id="wait" class="screen">
    <div class="box">
      <div style="font-size:20px">상대를 찾는 중<span class="dots"></span></div>
      <div class="wait-pcs"><img src="img/pumpkin_move.png" alt=""><img src="img/wisp_move.png" alt=""></div>
      <div style="color:var(--dim);font-size:13px;margin-bottom:14px" id="waitInfo">접속한 친구와 자동으로 짝을 지어요</div>
      <button class="btn" id="waitAiBtn" hidden style="margin-bottom:10px">기다리는 동안 컴퓨터와 연습</button>
      <button class="btn sub" id="cancelBtn">그만 찾기</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="bub" id="bubOpp"></div>
    <div class="bub me" id="bubMe"></div>
    <div class="emo-pan" id="emoPan" hidden>
      <div class="emo-grid" id="emoGrid"></div>
      <label class="emo-hide"><input type="checkbox" id="emoHide"> 상대가 보낸 감정 표현 숨기기</label>
    </div>
    <div class="box bar" id="oppBar">
      <img id="oppImg" alt="">
      <div class="who"><div class="name"><img class="tier" id="oppTier" alt=""><span id="oppName"></span><img class="crown" id="oppCrown" src="img/icon_win.png" alt="오늘의 1등" hidden></div><div class="info" id="oppInfo"></div><div class="tbar"><i id="oppT"></i></div></div>
      <div class="clock" id="oppClock"></div>
    </div>
    <div class="board-wrap">
      <svg id="board" viewBox="-10 0 380 620" aria-label="호박 고누 판"></svg>
      <div class="hint" id="hint"></div>
    </div>
    <div class="box bar" id="meBar">
      <img id="meImg" alt="">
      <div class="who"><div class="name"><img class="tier" id="meTier" alt=""><span id="meName"></span><img class="crown" id="meCrown" src="img/icon_win.png" alt="오늘의 1등" hidden></div><div class="info" id="meInfo"></div><div class="tbar"><i id="meT"></i></div></div>
      <div class="clock" id="meClock"></div>
    </div>
    <div class="foot"><span class="moves" id="movesInfo"></span><span class="snd"><button class="sndb" id="emoBtn" aria-label="감정 표현"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v8H7l-3 3v-3H2z" fill="currentColor"/><g fill="#1b120d"><rect x="5" y="6" width="1.6" height="1.6"/><rect x="9.4" y="6" width="1.6" height="1.6"/></g></svg></button><button class="sndb sfxT" aria-label="효과음"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="w" d="M11 5.5q2 2.5 0 5M12.8 3.8q3.4 4.2 0 8.4" stroke="currentColor" stroke-width="1.6" fill="none"/><path class="x" d="M10.5 5.5l5 5M15.5 5.5l-5 5" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="sndb bgmT" aria-label="배경음악"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5l8-1.5v9.5a2.2 2 0 1 1-1.6-1.9V4.2L7.6 5.1v7.4a2.2 2 0 1 1-1.6-1.9z" fill="currentColor"/><path class="x" d="M1.5 14.5l13-13" stroke="#ff6b5a" stroke-width="2"/></svg></button></span><button class="btn sub small" id="leaveBtn">기권하기</button></div>
  </section>
</div>

<div class="modal" id="howModal"><div class="box">
  <h2 id="howTitle">놀이 방법</h2>
  <div class="helpbody" id="howBody"></div>
  <div class="hdots" id="howDots" aria-hidden="true"></div>
  <div class="help-acts"><button class="btn sub" id="howPrev">이전</button><button class="btn" id="howNext">다음</button></div>
</div></div>

<div class="modal" id="resultModal"><div class="box result">
  <img id="resImg" alt="">
  <h2 id="resTitle"></h2>
  <p id="resText"></p>
  <p id="resScore" class="score"></p>
  <div class="stack">
    <button class="btn" id="againBtn">한 판 더</button>
    <button class="btn sub" id="homeBtn">처음으로</button>
  </div>
</div></div>

<div class="modal" id="decoModal"><div class="box">
  <h2>꾸미기</h2>
  <div class="deco-tier" id="decoTier"></div>
  <div class="deco-grid" id="decoGrid"></div>
  <p class="deco-note">등급은 <b>판수</b>, 꾸미기는 <b>이긴 횟수</b>로 열려요.<br>같은 친구와는 하루 5판, 10수 넘게 둔 판만 세어요.</p>
  <button class="btn" data-close>닫기</button>
</div></div>

<div class="modal" id="aiModal"><div class="box">
  <h2>컴퓨터와 연습</h2>
  <p class="deco-note" style="margin-top:0">연습 경기는 점수와 기록에 들어가지 않아요.</p>
  <div class="stack" id="aiOpts">
    <button class="ai-opt" data-lv="easy"><span class="pv"><img src="img/wisp_idle.png" alt=""></span><span><b>아기 도깨비</b> · 쉬움<small>대충 두지만, 바로 지는 자리는 피해요</small></span></button>
    <button class="ai-opt" data-lv="normal"><span class="pv"><img src="img/wisp_move.png" alt=""></span><span><b>도깨비</b> · 보통<small>세 수 앞을 내다보고 둬요</small></span></button>
    <button class="ai-opt" data-lv="hard"><span class="pv"><img src="img/wisp_idle.png" alt=""><img class="hat" src="img/acc_wizard.png" alt=""></span><span><b>도깨비 대장</b> · 어려움<small>완벽하게 둬요. 비기기만 해도 대단해요!</small></span></button>
  </div>
  <button class="btn sub" data-close style="margin-top:12px">닫기</button>
</div></div>

<div class="toast" id="toast"></div>
<div class="netbar" id="netBar">연결이 끊겼어요. 다시 연결하는 중…</div>
<script type="module" src="app.js"></script>
</body>
</html>
